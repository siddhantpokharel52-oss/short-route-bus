events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Docker's internal DNS — resolves service names at request time (not startup)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=public_api:10m rate=100r/m;
    limit_req_zone $http_authorization zone=auth_api:10m rate=1000r/m;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # FastAPI's own interactive docs — exact matches so they win over the
        # broad /api/ prefix block below (which would otherwise route
        # /api/docs to Django's own, separate Swagger UI instead). This is
        # the only way to reach FastAPI's docs — including the master
        # Public API's — through the normal nginx-fronted host; hitting the
        # FastAPI container's own port directly (:8001/api/docs) still works
        # too. "Try it out" calls made from this page are relative URLs, so
        # they correctly hit /public-api/v1/... and /api/v1/live/... through
        # this same nginx, no separate CORS/server config needed.
        location = /public-api/docs {
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream/api/docs;
            proxy_set_header Host $host;
        }

        location = /public-api/redoc {
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream/api/redoc;
            proxy_set_header Host $host;
        }

        location = /public-api/openapi.json {
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream/api/openapi.json;
            proxy_set_header Host $host;
        }

        # The docs/redoc HTML above references this exact absolute path
        # (FastAPI bakes app.openapi_url in as-is, not relative to wherever
        # the page was loaded from) — without this, "Try it out" schema
        # fetch 404s against Django's /api/ catch-all instead. Not a
        # collision: Django has no route at this exact path.
        location = /api/openapi.json {
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream/api/openapi.json;
            proxy_set_header Host $host;
        }

        # Public API's own WebSocket (ticket delivery push) — exact match so it
        # takes precedence over the broader /public-api/ prefix block below,
        # which has no Upgrade/Connection headers and would otherwise silently
        # fail the WS handshake rather than erroring loudly.
        location = /public-api/v1/ws/tickets/ {
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        location /public-api/ {
            limit_req zone=public_api burst=20 nodelay;
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/live/ {
            limit_req zone=auth_api burst=50 nodelay;
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        location /ws/v1/ {
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        location /ws/ {
            set $django_upstream django:8000;
            proxy_pass http://$django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        location /api/ {
            limit_req zone=auth_api burst=100 nodelay;
            set $django_upstream django:8000;
            proxy_pass http://$django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            set $django_upstream django:8000;
            proxy_pass http://$django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/ {
            set $django_upstream django:8000;
            proxy_pass http://$django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            set $fastapi_upstream fastapi:8001;
            proxy_pass http://$fastapi_upstream;
        }

        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
