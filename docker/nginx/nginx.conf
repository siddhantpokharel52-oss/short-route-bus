events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=100r/m;
    limit_req_zone $http_authorization zone=auth_api:10m rate=1000r/m;

    # Upstream services
    upstream django {
        server django:8000;
    }

    upstream fastapi {
        server fastapi:8001;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Master Consumer API — mobile-api.citybus.com.np
    server {
        listen 443 ssl;
        server_name mobile-api.citybus.com.np;

        ssl_certificate     /etc/letsencrypt/live/citybus.com.np/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/citybus.com.np/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Docs
        location = /docs    { proxy_pass http://fastapi/api/docs;        proxy_set_header Host $host; }
        location = /redoc   { proxy_pass http://fastapi/api/redoc;       proxy_set_header Host $host; }
        location = /openapi.json { proxy_pass http://fastapi/api/openapi.json; proxy_set_header Host $host; }

        # Ticket-delivery WebSocket
        location = /v1/ws/tickets/ {
            proxy_pass http://fastapi/public-api/v1/ws/tickets/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        # All other API calls
        location / {
            limit_req zone=public_api burst=20 nodelay;
            proxy_pass http://fastapi/public-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS — citybus.com.np and all tenant subdomains (*.citybus.com.np)
    # Requires a wildcard SSL certificate: *.citybus.com.np
    server {
        listen 443 ssl;
        server_name citybus.com.np www.citybus.com.np *.citybus.com.np;

        ssl_certificate     /etc/letsencrypt/live/citybus.com.np/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/citybus.com.np/privkey.pem;
        # NOTE: this cert must cover *.citybus.com.np (wildcard).
        # Issue with: certbot certonly --dns-<provider> -d citybus.com.np -d *.citybus.com.np
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # FastAPI's own interactive docs — exact matches so they win over the
        # broad /api/ location below (which would otherwise route /api/docs
        # to Django's separate Swagger UI instead). Only way to reach
        # FastAPI's docs — including the master Public API's — through this
        # host; the container's own port (:8001/api/docs) also still works.
        location = /public-api/docs {
            proxy_pass http://fastapi/api/docs;
            proxy_set_header Host $host;
        }

        location = /public-api/redoc {
            proxy_pass http://fastapi/api/redoc;
            proxy_set_header Host $host;
        }

        location = /public-api/openapi.json {
            proxy_pass http://fastapi/api/openapi.json;
            proxy_set_header Host $host;
        }

        # The docs/redoc HTML above references this exact absolute path
        # (FastAPI bakes app.openapi_url in as-is, not relative to wherever
        # the page was loaded from) — without this, "Try it out" schema
        # fetch 404s against Django's /api/ catch-all instead. Not a
        # collision: Django has no route at this exact path.
        location = /api/openapi.json {
            proxy_pass http://fastapi/api/openapi.json;
            proxy_set_header Host $host;
        }

        # Public API's own WebSocket (ticket delivery push) — exact match so it
        # takes precedence over the broader /public-api/ prefix block below,
        # which has no Upgrade/Connection headers and would otherwise silently
        # fail the WS handshake (falls through as a plain HTTP request that
        # never upgrades) rather than erroring loudly. Same pattern as the
        # /api/v1/live/ and /ws/ blocks below.
        location = /public-api/v1/ws/tickets/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        # FastAPI — Public API (rate-limited)
        location /public-api/ {
            limit_req zone=public_api burst=20 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI — Live GPS/WebSocket
        location /api/v1/live/ {
            limit_req zone=auth_api burst=50 nodelay;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        # FastAPI WebSocket connections
        location /ws/v1/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        # Django WebSocket (Channels)
        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        # Django REST API
        location /api/ {
            limit_req zone=auth_api burst=100 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://fastapi;
        }

        # Frontend (React SPA)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
