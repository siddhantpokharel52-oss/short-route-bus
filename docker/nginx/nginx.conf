events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=100r/m;
    limit_req_zone $http_authorization zone=auth_api:10m rate=1000r/m;

    # Upstream services
    upstream django {
        server django:8000;
    }

    upstream fastapi {
        server fastapi:8001;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Master Consumer API — mobile-api.citybus.com.np
    server {
        listen 443 ssl;
        server_name mobile-api.citybus.com.np;

        ssl_certificate     /etc/letsencrypt/live/citybus.com.np/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/citybus.com.np/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Root redirects to docs
        location = /       { return 302 /docs; }
        location = /v1/    { return 302 /docs; }

        # Docs
        location = /docs             { proxy_pass http://fastapi/api/docs;        proxy_set_header Host $host; }
        location = /redoc            { proxy_pass http://fastapi/api/redoc;       proxy_set_header Host $host; }
        location = /openapi.json     { proxy_pass http://fastapi/api/openapi.json; proxy_set_header Host $host; }
        location = /api/openapi.json { proxy_pass http://fastapi/api/openapi.json; proxy_set_header Host $host; }

        # NamastePay's own, separate Swagger doc -- same 1:1 passthrough
        # treatment as the docs/openapi.json lines above, for the same reason:
        # without an explicit location, the catch-all `location /` below
        # would silently rewrite these with a /public-api/v1/ prefix the
        # actual FastAPI routes (mounted at top level, not under that prefix)
        # don't have, turning both into a 404.
        location = /namastepay-docs         { proxy_pass http://fastapi/namastepay-docs;         proxy_set_header Host $host; }
        location = /namastepay-openapi.json { proxy_pass http://fastapi/namastepay-openapi.json; proxy_set_header Host $host; }

        # Health check
        location = /health { proxy_pass http://fastapi/health; proxy_set_header Host $host; }

        # Ticket-delivery WebSocket
        location = /v1/ws/tickets/ {
            proxy_pass http://fastapi/public-api/v1/ws/tickets/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        # Also accept the fully-qualified /public-api/v1/... path as-is --
        # that's the path FastAPI's own Swagger docs show (since internally
        # every route really is mounted under that prefix), so a client that
        # copies the path straight from /docs (as Yatroo did for
        # federated-login) must not get it silently double-prefixed by the
        # catch-all below into /public-api/v1/public-api/v1/... This is a
        # 1:1 passthrough (location prefix == proxy_pass path), not a
        # rewrite -- kept in sync with the catch-all as one thing to maintain.
        location /public-api/v1/ {
            limit_req zone=public_api burst=20 nodelay;
            proxy_pass http://fastapi/public-api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other API calls -- clean URLs with no /public-api/v1/ prefix,
        # e.g. /stops/autocomplete/, /partner/federated-login. This is the
        # scheme documented in the Postman collections and Yatroo
        # confirmation doc.
        location / {
            limit_req zone=public_api burst=20 nodelay;
            proxy_pass http://fastapi/public-api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS — citybus.com.np and all tenant subdomains (*.citybus.com.np)
    # Requires a wildcard SSL certificate: *.citybus.com.np
    server {
        listen 443 ssl;
        server_name citybus.com.np www.citybus.com.np *.citybus.com.np;

        ssl_certificate     /etc/letsencrypt/live/citybus.com.np/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/citybus.com.np/privkey.pem;
        # NOTE: this cert must cover *.citybus.com.np (wildcard).
        # Issue with: certbot certonly --dns-<provider> -d citybus.com.np -d *.citybus.com.np
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # The Public API (Yatroo's Master Consumer API) is deliberately NOT
        # reachable on this domain -- mobile-api.citybus.com.np is its only
        # home, so there's exactly one place for an integrator to look. This
        # domain is for the CityBus-internal surface only: Django's own API
        # (/api/, docs at /api/docs/) and the tenant-portal frontend below.

        # FastAPI — Live GPS/WebSocket
        location /api/v1/live/ {
            limit_req zone=auth_api burst=50 nodelay;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600;
        }

        # FastAPI WebSocket connections
        location /ws/v1/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        # Django WebSocket (Channels)
        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        # Django REST API
        location /api/ {
            limit_req zone=auth_api burst=100 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://fastapi;
        }

        # Frontend (React SPA)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
